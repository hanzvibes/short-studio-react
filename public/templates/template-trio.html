const gui=$('gui'),go=$('go'),cc=$('gcc'),snd=$('snd'),pl=$('pl'),trk=$('gtr'),fl=$('gfl'),kn=$('gkn'),tc=$('gtc'),td=$('gtd');
const fmt=s=>{s=Math.max(0,Math.floor(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
let hideAt=0,drag=false,shown=false,ip=null,im=null,started=false;
function show(){gui.classList.add('on');hideAt=performance.now()+3000}
function seek(x){T=Math.min(Math.max(x,0),LEN-.01);vLast=-1;syn&&syn.cancel()}
function tog(){paused=!paused;if(paused){syn&&syn.cancel()}else vLast=-1;show()}
window.gTap=()=>{if(gui.classList.contains('on')&&!paused)gui.classList.remove('on');else show()};
window.gSync=()=>{im=null};window.gShow=show;
cc.onclick=e=>{e.stopPropagation();tog()};
$('grw').innerHTML=IC.rw;$('gff').innerHTML=IC.ff;pl.innerHTML=IC.re;
$('grw').onclick=e=>{e.stopPropagation();seek(T-5);show()};
$('gff').onclick=e=>{e.stopPropagation();seek(T+5);show()};
$('gbk').onclick=e=>{e.stopPropagation();paused=true;syn&&syn.cancel();gui.classList.remove('on');started=false;go.style.display='flex'};
const ph=(e)=>{const r=trk.getBoundingClientRect();seek((e.clientX-r.left)/r.width*LEN)};
trk.addEventListener('pointerdown',e=>{e.stopPropagation();drag=true;trk.setPointerCapture(e.pointerId);ph(e);show()});
trk.addEventListener('pointermove',e=>{if(drag){ph(e);show()}});
['pointerup','pointercancel'].forEach(n=>trk.addEventListener(n,()=>{drag=false;show()}));
$('gt1').textContent=(document.title||'Video').slice(0,40);
const d=new Date();$('gt2').textContent=d.toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'})+' · '+d.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}).replace('.',':');
$('gdt').textContent=fmt(LEN);td.textContent=fmt(LEN);
function ui(){
 const now=performance.now(),vis=go.style.display!=='none';
 if(!vis&&!started){started=true;show()}
 if(!vis){
  if(paused)gui.classList.add('on');
  else if(!drag&&now>hideAt)gui.classList.remove('on');
  const p=Math.min(T/LEN,1);fl.style.width=(p*100)+'%';kn.style.left=(p*100)+'%';tc.textContent=fmt(T);
  const k=paused?'play':'pause';if(k!==ip){ip=k;cc.innerHTML=IC[k]}
 }
 const m=vMute?'mute':'vol';if(m!==im){im=m;snd.innerHTML=IC[m]}
 requestAnimationFrame(ui)}
requestAnimationFrame(ui);
})();
